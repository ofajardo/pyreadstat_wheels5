name: Windows Specific steps
description: "Runs specific steps required for windows"

runs:
  using: "composite"
  steps:
    - name: Checkout libiconv
      uses: actions/checkout@v6
      with:
        repository: kiyolee/libiconv-win-build 
        ref: dff1030d222ba934e0f4a9cdab9c34134f072f68 # v1.18
        path: libiconv-win-build
        submodules: true
        persist-credentials: false

    - name: Checkout zlib
      uses: actions/checkout@v6
      with:
        repository: kiyolee/zlib-win-build
        ref: 30623e05e64fe4b97f2073ddaf8d3ba0e99d7249
        path: zlib-win-build
        submodules: true
        persist-credentials: false

    - name: Add msbuild to PATH
      uses: microsoft/setup-msbuild@v3

    # There is no static CRT (-MT) build for ARM64, so the ARM64 libraries use the
    # dynamic CRT, as Python extensions do.
    # WholeProgramOptimization is disabled because /GL objects can only be linked by the
    # exact same MSVC version; the runner may build these libs and the extension with
    # different toolsets (C1047).
    - name: build libiconv
      run: |
        msbuild.exe libiconv-win-build/%BUILD_DIR%/libiconv.sln /property:Configuration=Release;Platform=%PLATFORM% /p:WholeProgramOptimization=false
        copy libiconv-win-build\\include\\iconv.h pyreadstat\\win_libs\\64bit
        copy libiconv-win-build\\%BUILD_DIR%\\%PLATFORM%\\Release\\libiconv-static.lib  pyreadstat\\win_libs\\64bit
      shell: cmd
      env:
        BUILD_DIR: ${{ runner.arch == 'ARM64' && 'build-VS2022-arm64' || 'build-VS2022-MT' }}
        PLATFORM: ${{ runner.arch == 'ARM64' && 'ARM64' || 'x64' }}

    - name: build zlib
      run: |
        msbuild.exe zlib-win-build/%BUILD_DIR%/zlib.sln /property:Configuration=Release;Platform=%PLATFORM% /p:WholeProgramOptimization=false
        copy zlib-win-build\\zlib.h pyreadstat\\win_libs\\64bit
        copy zlib-win-build\\zconf.h pyreadstat\\win_libs\\64bit
        copy zlib-win-build\\%BUILD_DIR%\\%PLATFORM%\\Release\\libz-static.lib  pyreadstat\\win_libs\\64bit
      shell: cmd
      env:
        BUILD_DIR: ${{ runner.arch == 'ARM64' && 'build-VS2022-arm64' || 'build-VS2022-MT' }}
        PLATFORM: ${{ runner.arch == 'ARM64' && 'ARM64' || 'x64' }}

